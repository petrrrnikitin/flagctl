deptrac:
  paths:
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Domain\\#'
    - name: Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Application\\#'
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Infrastructure\\#'
    - name: Api
      collectors:
        - type: classNameRegex
          value: '#^App\\Api\\#'
  ruleset:
    Domain: []
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    Api:
      - Application
      - Domain